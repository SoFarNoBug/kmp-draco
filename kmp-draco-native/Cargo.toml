[package]
name = "kmp_draco_native"
version = "0.2.0"
edition = "2021"
description = "kmp-draco native: Draco bitstream decode (draco-core)"
license = "Apache-2.0"
publish = false
rust-version = "1.88"

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]
name = "kmp_draco_native"

[dependencies]
draco-core = { version = "2.3.3", default-features = false, features = ["decoder", "edgebreaker_valence_decode", "legacy_bitstream_decode"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
